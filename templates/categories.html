{% extends "base.html" %}

{% block content %}

<nav aria-label="breadcrumb" class="mb-4">
    <ol class="breadcrumb">
        <li class="breadcrumb-item"><a href="/subjects" class="text-decoration-none">Subjects</a></li>
        <li class="breadcrumb-item active" aria-current="page">Categories</li>
    </ol>
</nav>

<div class="row mb-5">
    <div class="col-md-6">
        <div class="card shadow-sm">
            <div class="card-header bg-success text-white">
                <h5 class="mb-0">Create Category</h5>
            </div>
            <div class="card-body">
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label">Category Name</label>
                        <input type="text" class="form-control" name="name" placeholder="e.g. Algebra" required>
                    </div>
                    <button type="submit" class="btn btn-success w-100">Add Category</button>
                </form>
            </div>
        </div>
    </div>
</div>

<h3 class="mb-3">All Categories</h3>

<div class="row row-cols-1 row-cols-md-3 g-4">
    {% for category in categories %}
    <div class="col">
        <div class="card h-100 shadow-sm border-success">
            <div class="card-body">
                <h5 class="card-title text-success">{{ category.name }}</h5>
            </div>
            <div class="card-footer bg-transparent border-top-0">
                <a href="/upload/{{ category.id }}" class="btn btn-outline-success btn-sm w-100 mt-2">Upload Excel
                    Questions</a>
            </div>
        </div>
    </div>
    {% else %}
    <div class="col-12">
        <div class="alert alert-info">No categories created yet for this subject. Add one above!</div>
    </div>
    {% endfor %}
</div>

{% endblock %}
